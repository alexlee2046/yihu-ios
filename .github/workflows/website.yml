name: Website consent acceptance
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run llms:export && npm run build
      - run: npm test
      - name: Prepare Chinese glyphs for Linux visual checks
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Prepare pinned test-only WebKit SDK
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yihu-playwright-browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/yihu-browser-sdk" --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
          node "$RUNNER_TEMP/yihu-browser-sdk/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Chromium and WebKit preview acceptance
        env:
          NODE_PATH: ${{ runner.temp }}/yihu-browser-sdk/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yihu-playwright-browsers
        run: node tools/preview-browser-smoke.mjs
      - name: Offline synthetic contact contracts (never a live widget)
        env:
          NODE_PATH: ${{ runner.temp }}/yihu-browser-sdk/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yihu-playwright-browsers
          YIHU_CONTACT_DIST: ${{ runner.temp }}/yihu-contact-configured
          PUBLIC_CHATWOOT_ENABLED: 'true'
          PUBLIC_CHATWOOT_BASE_URL: 'https://chatwoot.kynora.world'
          PUBLIC_CHATWOOT_WEBSITE_TOKEN: 'synthetic-not-a-real-inbox'
          PUBLIC_CONTACT_EMAIL_ENABLED: 'true'
          PUBLIC_CONTACT_EMAIL: 'support@example.test'
        run: |
          npm run build -- --outDir "$YIHU_CONTACT_DIST"
          node tools/contact-browser-smoke.mjs
      - name: Preserve offline contact evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-contact-offline
          path: ${{ runner.temp }}/yihu-contact-offline/
          retention-days: 3
      - name: Verify committed discovery exports
        run: python3 tools/export-llms.py --check && git diff --exit-code -- public/llms.txt public/llms-full.txt
      - name: Preserve preview and discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-preview-evidence
          path: |
            website/public/llms.txt
            website/public/llms-full.txt
            ${{ runner.temp }}/yihu-preview-smoke/
          retention-days: 3
