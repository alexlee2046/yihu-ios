name: Website consent acceptance
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run llms:export && npm run build
      - run: npm test
      - name: Browser preview acceptance (existing remote runner)
        run: node tools/preview-browser-smoke.mjs
      - name: Verify committed discovery exports
        run: python3 tools/export-llms.py --check && git diff --exit-code -- public/llms.txt public/llms-full.txt
      - name: Preserve preview and discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-preview-evidence
          path: |
            website/public/llms.txt
            website/public/llms-full.txt
            ${{ runner.temp }}/yihu-preview-smoke/
          retention-days: 3
