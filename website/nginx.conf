server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json text/markdown;
    server_tokens off;
    absolute_redirect off;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/markdown text/css application/javascript application/json application/xml image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag noindex always;
        return 200 "ok\n";
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        try_files $uri =404;
    }

    # Preserve Vercel's trailingSlash exception for well-known files.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Match trailingSlash:true, including unknown extensionless URLs and queries.
    # Relative redirects preserve the external HTTPS host behind the shadow proxy.
    location ~ "^.*/[^/.]+$" {
        # Raw escaped paths prevent decoded backslashes/CRLF from entering Location.
        if ($request_uri ~ "^[^?]*\\\\") { return 400; }
        if ($request_uri ~ "^/+([^?]*)") {
            return 308 /$1/$is_args$args;
        }
        return 400;
    }

    # Exact retired batches from vercel.json; do not retire other /samples/ files.
    location ~ "^/(?:api/retired-sample/$|samples/(?:p10-token-recapture|p11-model-preflight|p12-level-preflight|p13-busy-debounce|p14-pcm-admission|p15-foreground-rebind|p16-buffer-pressure|p17-cross-device-fields|p18-host-bridge-outcomes|p19-file-chunk-bridge|p20-recording-notes-handoff|p21-notification-payload-model|p22-empty-field-display-defaults|p23-department-minutes-ownership-archive|p24-attachment-name-metadata-provenance|p25-evidence-link-admission-preflight|p26-export-encoding-delimiter-preflight|p27-audio-level-not-accuracy-review|p28-radar-feed-url-boundary-preflight|p29-history-reference-integrity-review|p30-radar-json-null-validation|p31-timezone-timestamp-review|p32-radar-evidence-second-check|p8-opportunity-preflight|p9-audio-preflight)(?:/|$))" {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Robots-Tag noindex always;
        return 410 "This sample has been retired. See https://getyihu.com/ for current guides.\n";
    }

    location ~ "[.]m4a$" {
        types { audio/mp4 m4a; }
        try_files $uri =404;
    }

    location ~ "[.]md$" {
        default_type text/markdown;
        charset_types text/markdown;
        try_files $uri =404;
    }

    location ~ "^/_astro/.+[.][^/]+$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
