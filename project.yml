name: Yihu
options:
  bundleIdPrefix: org.example.yihu
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    YIHU_BUNDLE_ID: org.example.yihu
    YIHU_APP_GROUP: group.org.example.yihu
    COLLIE_APNS_ENVIRONMENT: development
targets:
  CollieiOS:
    type: application
    platform: iOS
    sources:
      - Apps/Collie
      - Shared/CollieShareInbox.swift
      - Shared/HermesTaskAttributes.swift
      - Shared/AgentProtocol.swift
      - Shared/YihuWatchSnapshot.swift
      - Shared/YihuWatchDraft.swift
      - Shared/YihuWatchVoice.swift
    dependencies:
      - target: CollieShare
      - target: CollieWidgets
      - target: YihuWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YIHU_BUNDLE_ID)
        INFOPLIST_FILE: Apps/Collie/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Collie/Collie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
        com.apple.ApplicationGroups.iOS:
          enabled: 1
  CollieShare:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/CollieShare
      - Shared/CollieShareInbox.swift
      - path: Apps/Collie/Yihu.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YIHU_BUNDLE_ID).share
        INFOPLIST_FILE: Extensions/CollieShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/CollieShare/CollieShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
  CollieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/CollieWidgets
      - Shared/HermesTaskAttributes.swift
      - Shared/AgentProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YIHU_BUNDLE_ID).widgets
        INFOPLIST_FILE: Extensions/CollieWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  YihuWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - Apps/YihuWatch
      - Shared/YihuWatchSnapshot.swift
      - Shared/YihuWatchDraft.swift
      - Shared/YihuWatchVoice.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YIHU_BUNDLE_ID).watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(YIHU_BUNDLE_ID)
        INFOPLIST_KEY_CFBundleDisplayName: 一呼
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于手表录音，经配对手机端侧识别，音频不上传云端。
        SKIP_INSTALL: YES
  CollieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/CollieUI
    dependencies:
      - target: CollieiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YIHU_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  YihuWatch:
    build:
      targets:
        YihuWatch: all
    run:
      config: Debug
  CollieiOS:
    build:
      targets:
        CollieiOS: all
    run:
      config: Debug
    test:
      targets:
        - CollieUITests
