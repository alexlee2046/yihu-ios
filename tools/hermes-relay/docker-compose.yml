version: '3.8'

services:
  hermes-relay:
    build: .
    container_name: hermes-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:9444:9444"
    volumes:
      - ./data:/app/data
    environment:
      - APNS_KEY_PATH=/app/data/AuthKey.p8
      - APNS_KEY_ID=${APNS_KEY_ID:-XXXXXXXXXX}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-YYYYYYYYYY}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-org.example.yihu}
